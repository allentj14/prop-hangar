<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prop Hangar</title>
<meta name="theme-color" content="#1d2733">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Prop Hangar">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.45 system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
img{max-width:100%}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--accent-ink);padding:10px 16px;border-radius:6px;font:600 .9rem var(--f-body);z-index:20;box-shadow:0 4px 14px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.status{font-size:.75rem;color:var(--muted);margin-bottom:8px}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky control deck on top, stacked rank sections of tap-to-open plane cards below; single column for phones, two columns on wide screens */
:root{
  --bg:#eef0f2; --panel:#ffffff; --ink:#18202a; --muted:#5d6876; --line:#d5dae0;
  --accent:#c27a12; --accent-ink:#ffffff; --deck:#1d2733; --deck-ink:#e9edf1;
  --bnz:#b4532a; --nrg:#2f6fa8; --trn:#2f8a4f; --bmb:#6a5a9c; --atk:#8a6d1f;
  --chip:#e2e6ea; --prem:#a56a00;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-data:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12171d; --panel:#1a222b; --ink:#e6eaee; --muted:#93a0ad; --line:#2c3743;
  --accent:#e9a23b; --accent-ink:#1a1206; --deck:#0d1217; --deck-ink:#e6eaee;
  --bnz:#e5875c; --nrg:#6aa9e0; --trn:#62c285; --bmb:#a594d8; --atk:#d0b15a;
  --chip:#26313c; --prem:#e9b44c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171d; --panel:#1a222b; --ink:#e6eaee; --muted:#93a0ad; --line:#2c3743;
  --accent:#e9a23b; --accent-ink:#1a1206; --deck:#0d1217; --deck-ink:#e6eaee;
  --bnz:#e5875c; --nrg:#6aa9e0; --trn:#62c285; --bmb:#a594d8; --atk:#d0b15a;
  --chip:#26313c; --prem:#e9b44c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--deck)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.deck{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--deck);color:var(--deck-ink);padding-block:12px 10px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:700;font-size:1.6rem;letter-spacing:.02em;margin:0;text-transform:uppercase;text-wrap:balance}
h1 span{color:var(--accent)}
.ver{font-family:var(--f-data);font-size:.7rem;opacity:.7}
.tabs{display:flex;gap:6px;margin-top:10px}
.tab,.seg button{font:600 .95rem var(--f-display);letter-spacing:.06em;text-transform:uppercase;border:1px solid rgba(255,255,255,.25);background:transparent;color:var(--deck-ink);padding:6px 14px;border-radius:4px;cursor:pointer}
.tab[aria-pressed="true"],.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.nations{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:4px;scrollbar-width:thin}
.nations button{flex:0 0 auto;font:600 .85rem var(--f-body);border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:var(--deck-ink);padding:5px 11px;border-radius:999px;cursor:pointer}
.nations button[aria-pressed="true"]{background:var(--deck-ink);color:var(--deck)}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.controls input,.controls select{font:500 .9rem var(--f-body);padding:7px 10px;border-radius:4px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:var(--deck-ink);min-width:0}
.controls input{flex:1 1 160px}
.controls select option{color:#18202a;background:#fff}
.seg{display:flex;gap:0}
.seg button{border-radius:0;padding:6px 10px}
.seg button:first-child{border-radius:4px 0 0 4px}.seg button:last-child{border-radius:0 4px 4px 0}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:14px 40px}
.count{font-size:.85rem;color:var(--muted);margin-bottom:6px}
.rank{margin-top:18px}
.rank h2{font-family:var(--f-display);font-weight:700;font-size:1.25rem;letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px;display:flex;align-items:center;gap:10px}
.rank h2::after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:1fr;gap:8px}
@media(min-width:820px){.grid{grid-template-columns:1fr 1fr}}
details.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;min-width:0}
details.card[open]{border-color:var(--accent)}
summary{list-style:none;cursor:pointer;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:4px 10px}
summary::-webkit-details-marker{display:none}
.nm{font-family:var(--f-display);font-weight:600;font-size:1.15rem;line-height:1.15}
.pos{font-family:var(--f-data);font-size:.7rem;color:var(--muted);overflow-wrap:anywhere}.pos a{color:var(--nrg)}
.br{font-family:var(--f-data);font-weight:500;font-size:.95rem;text-align:right;white-space:nowrap}
.br small{display:block;font-size:.65rem;color:var(--muted);font-weight:400}
.tags{display:flex;gap:5px;flex-wrap:wrap;grid-column:1/-1}
.pill{font-size:.72rem;font-weight:600;padding:2px 7px;border-radius:3px;border:1px solid currentColor;white-space:nowrap}
.s-bnz{color:var(--bnz)}.s-nrg{color:var(--nrg)}.s-trn{color:var(--trn)}.s-bmb{color:var(--bmb)}.s-atk{color:var(--atk)}
.pill.prem{color:var(--prem)}
.quick{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-family:var(--f-data);font-size:.78rem;font-variant-numeric:tabular-nums}
.quick div{background:var(--chip);border-radius:3px;padding:4px 6px;min-width:0}
.arm{grid-column:1/-1;font-size:.82rem;line-height:1.35;display:grid;gap:3px;min-width:0}
.arm .g{font-weight:600;overflow-wrap:anywhere}
.arm .g small{font-family:var(--f-data);font-weight:400;color:var(--muted);font-size:.72rem}
.arm .o{display:flex;flex-wrap:wrap;gap:4px}
.arm .o span.t{background:transparent;border:1px solid var(--line)}
.arm .o span{font-size:.7rem;background:var(--chip);border-radius:3px;padding:1px 6px;color:var(--ink)}
.quick b{display:block;font-family:var(--f-body);font-size:.62rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.body{padding:0 12px 12px;display:grid;gap:10px}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 14px;font-size:.85rem}
.kv div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted var(--line);padding:2px 0}
.kv span:last-child{font-family:var(--f-data);font-variant-numeric:tabular-nums;text-align:right}
.blk h4{margin:0 0 2px;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.blk p{margin:0;font-size:.88rem;overflow-wrap:anywhere}
.good{color:var(--trn)}.bad{color:var(--bnz)}
.lu{display:grid;gap:8px}
.lurow{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:grid;grid-template-columns:56px 1fr;gap:10px;min-width:0}
.lubr{font-family:var(--f-display);font-weight:700;font-size:1.6rem;line-height:1;color:var(--accent)}
.lubr small{display:block;font-family:var(--f-body);font-size:.62rem;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
.lurow ol{margin:0;padding-left:18px;display:grid;gap:3px;font-size:.9rem;min-width:0}
.lucol{min-width:0;display:grid;gap:8px}
.lurow li{min-width:0}
details.pick>summary{display:block;cursor:pointer;padding:2px 0;list-style:none}
details.pick>summary::-webkit-details-marker{display:none}
details.pick>summary::after{content:" ▸";color:var(--muted);font-size:.8em}
details.pick[open]>summary::after{content:" ▾"}
details.pick[open]>summary{color:var(--accent)}
.pickbody{margin:6px 0 4px -18px}
.rkb{display:inline-block;min-width:2.1em;font-family:var(--f-data);font-size:.68rem;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 3px;margin-right:6px;text-align:center}
.stepup{border-top:1px dashed var(--line);padding-top:6px}
.stephd{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:600;margin-bottom:3px}
b.plays{color:var(--trn)}
.watch .stephd{color:var(--bnz)}
.br small.up{color:var(--trn);font-weight:600}
.br small.dn{color:var(--bnz)}
.stepup ol{margin:0;padding-left:18px;display:grid;gap:3px;font-size:.9rem}
.lurow li span{font-family:var(--f-data);font-size:.75rem;color:var(--muted)}
.note{font-size:.82rem;color:var(--muted);max-width:65ch}
.empty{padding:30px 0;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){details.card[open] .body{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(-3px)}to{opacity:1;transform:none}}}
</style>

</head>
<body>
<header class="deck wrap">
  <div class="top"><h1>Prop <span>Hangar</span> Index</h1><div class="ver" id="ver"></div></div>
  <div class="tabs" role="group" aria-label="View">
    <button class="tab" id="tab-planes" aria-pressed="true">Planes</button>
    <button class="tab" id="tab-lineups" aria-pressed="false">Best lineups</button>
  </div>
  <div class="nations" id="nations" role="group" aria-label="Nation"></div>
  <div class="controls" id="ctl-planes">
    <input id="q" type="search" placeholder="Search plane, gun, engine…" aria-label="Search">
    <select id="style" aria-label="Play style">
      <option value="">All styles</option><option value="bnz">Boom &amp; Zoom</option><option value="nrg">Energy fighter</option>
      <option value="trn">Turn fighter</option><option value="atk">Attacker</option><option value="bmb">Bombers</option>
    </select>
    <select id="rank" aria-label="Rank"><option value="">All ranks</option></select>
    <div class="seg" role="group" aria-label="Game mode"><button id="m-rb" aria-pressed="true">RB</button><button id="m-ab" aria-pressed="false">AB</button></div>
  </div>
  <div class="controls" id="ctl-lineups" hidden>
    <div class="seg" role="group" aria-label="Game mode"><button id="l-rb" aria-pressed="true">RB</button><button id="l-ab" aria-pressed="false">AB</button></div>
    <div class="seg" role="group" aria-label="Which planes"><button id="l-all" aria-pressed="true">Best</button><button id="l-tech" aria-pressed="false">Tech tree only</button><button id="l-step" aria-pressed="false">Step up</button><button id="l-under" aria-pressed="false">Undertiered</button></div>
    <div class="seg" role="group" aria-label="Play style"><button id="ls-all" aria-pressed="true">All styles</button><button id="ls-bnz" aria-pressed="false">BnZ</button><button id="ls-nrg" aria-pressed="false">Energy</button><button id="ls-trn" aria-pressed="false">Turn</button></div>
  </div>
</header>
<main class="wrap">
  <div id="planes"></div>
  <div id="lineups" hidden></div>
</main>

<script>
let DATA = [];
let LINEUPS = [];
let META = {};
let BYID = {};
const NATIONS = ["USA","Germany","USSR","Great Britain","Japan","China","Italy","France","Sweden","Israel"];
const ROMAN = ["","I","II","III","IV","V","VI","VII","VIII","IX"];
const st = {view:"planes", nation:"USA", q:"", style:"", rank:"", mode:"rb", lmode:"RB", tech:false, lstyle:"all", step:false, under:false};
try{const s=JSON.parse(localStorage.getItem("wt-hangar")||"{}");Object.assign(st,s);}catch(e){}
const save=()=>{try{localStorage.setItem("wt-hangar",JSON.stringify({nation:st.nation,mode:st.mode,lmode:st.lmode,tech:st.tech,view:st.view,lstyle:st.lstyle,step:st.step,under:st.under}))}catch(e){}};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));


function styleKey(s){ if(s.startsWith("Boom"))return "bnz"; if(s.startsWith("Energy"))return "nrg"; if(s.startsWith("Turn"))return "trn"; if(s.startsWith("Attacker"))return "atk"; if(/bomber/i.test(s))return "bmb"; return "atk"; }
function stylePills(s){
  const parts = s.replace(/\(.*\)/,"").split(" / ").map(x=>x.trim()).filter(Boolean);
  return parts.map(p=>`<span class="pill s-${styleKey(p)}">${esc(p)}</span>`).join("") + (s.includes("(can")?`<span class="pill s-${styleKey(s)}">${esc(s.match(/\((.*)\)/)[1])}</span>`:"");
}
const fmt=(v,u="")=>v==null||v===""?"–":(typeof v==="number"?v.toLocaleString():v)+u;

function nationBar(){
  $("nations").innerHTML = ["All",...NATIONS].map(n=>`<button aria-pressed="${n===st.nation}" data-n="${esc(n)}">${esc(n)}</button>`).join("");
  $("nations").querySelectorAll("button").forEach(b=>b.onclick=()=>{st.nation=b.dataset.n;save();nationBar();render();});
}
function rankOptions(){
  const ranks=[...new Set(DATA.filter(r=>st.nation==="All"||r.n===st.nation).map(r=>r.rk))].sort((a,b)=>a-b);
  $("rank").innerHTML='<option value="">All ranks</option>'+ranks.map(r=>`<option value="${r}">Rank ${ROMAN[r]}</option>`).join("");
  $("rank").value = ranks.includes(+st.rank)?st.rank:""; if(!$("rank").value) st.rank="";
}
function shortGun(t){
  return t.replace(/ machine gun| cannon| autocannon/gi,"").replace(/ \(secondary\)/gi,"").replace(/ \((\d+) rds\)/g,(m,n)=>` (${(+n).toLocaleString()})`);
}
function armLine(r){
  const g = r.g ? shortGun(r.g).split("; ").join(" + ") : "";
  const tags=[];
  if(r.dg){const n=(r.dg.match(/(\d+)×/g)||[]).reduce((a,x)=>a+parseInt(x),0);tags.push(`${n} defensive gun${n===1?"":"s"}`);}
  if(r.bo){const m=r.bo.match(/(\d+)× ([\d,.]+ ?(?:kg|lb))/g);tags.push("Bombs"+(m?": "+[...new Set(m.map(x=>x.replace(/^\d+× /,"")))].slice(0,3).join(", "):""));}
  if(r.ro) tags.push("Rockets");
  if(r.to) tags.push("Torpedo");
  if(r.gp) tags.push("Gun pods / alt. guns");
  if(r.tg && r.tg.length){ tags.length=0; r.tg.forEach(t=>tags.push(t)); if(r.gp) tags.push("Gun pods / alt. guns"); }
  if(!g && !tags.length) return "";
  return `<div class="arm">${g?`<div class="g">${esc(g)}${r.bk?` <small>· ${r.bk} kg/s</small>`:""}</div>`:`<div class="g">No forward guns</div>`}${tags.length?`<div class="o">${tags.map(t=>`<span>${esc(t)}</span>`).join("")}</div>`:""}</div>`;
}
function card(r){
  const br = st.mode==="rb"?r.rb:r.ab, other = st.mode==="rb"?`AB ${fmt(r.ab)} · SB ${fmt(r.sb)}`:`RB ${fmt(r.rb)} · SB ${fmt(r.sb)}`;
  const kv=(k,v)=>`<div><span>${k}</span><span>${v}</span></div>`;
  const blk=(h,t,c="")=>t?`<div class="blk"><h4>${h}</h4><p class="${c}">${esc(t)}</p></div>`:"";
  return `<details class="card"><summary>
    <div><div class="nm">${esc(r.nm)}</div><div class="pos">${st.nation==="All"?esc(r.n)+" · ":""}Col ${r.c} · #${r.o}${r.f?" · "+esc(r.f):""} · ${esc(r.role)}</div></div>
    <div class="br">${br!=null?br.toFixed(1):"–"}<small>${st.mode.toUpperCase()} BR</small>${(()=>{const pl=st.mode==="rb"?r.plr:r.pla,ov=st.mode==="rb"?r.ovr:r.ova;return pl!=null&&Math.abs(ov)>=0.3?`<small class="${ov>0?"up":"dn"}">plays ~${pl.toFixed(1)}</small>`:""})()}</div>
    <div class="tags">${stylePills(r.s)}${r.ob!=="Tech tree"?`<span class="pill prem">★ ${esc(r.ob)}</span>`:""}</div>
    ${armLine(r)}
    <div class="quick"><div><b>Speed</b>${fmt(r.spd)}</div><div><b>Climb</b>${fmt(r.clb)}</div><div><b>Turn</b>${fmt(r.trn,"s")}</div><div><b>Roll</b>${fmt(r.rol,"°")}</div></div>
  </summary><div class="body">
    <div class="pos">${esc(r.fn)} · ${other}</div>
    ${blk("Forward guns",r.g)}
    ${r.ga||r.bk?`<div class="kv">${kv("Forward ammo",fmt(r.ga))}${kv("Burst (kg/s)",fmt(r.bk))}</div>`:""}
    ${blk("Defensive guns",r.dg)}
    ${blk("Bombs",r.bo)}${blk("Rockets",r.ro)}${blk("Torpedoes",r.to)}${blk("Optional / alternate guns",r.gp)}
    <div class="kv">
      ${kv("Top speed",fmt(r.spd," km/h"))}${kv("…at altitude",fmt(r.spa," m"))}
      ${kv("Sea level",fmt(r.sls," km/h"))}${kv("Climb rate",fmt(r.clb," m/s"))}
      ${kv("Time to "+fmt(r.cla," m"),fmt(r.clt," s"))}${kv("Turn time",fmt(r.trn," s"))}
      ${kv("Roll rate",fmt(r.rol," °/s"))}${kv("Ceiling",fmt(r.ceil," m"))}
      ${kv("Wing loading",fmt(r.wl," kg/m²"))}${kv("Power/weight",fmt(r.pw))}
      ${kv("Dive limit",fmt(r.vne," km/h"))}${kv("Flap rip",fmt(r.flp," km/h"))}
      ${kv("Engine",esc(r.eng||"–"))}${kv("Engines",fmt(r.ne))}
      ${kv("Crew",fmt(r.cr))}${kv("Takeoff mass",fmt(r.tom," kg"))}
      ${kv("Fuel",fmt(r.fu," kg"))}${kv("Flight time",fmt(r.ft," min"))}
      ${kv("Research",fmt(r.rp," RP"))}${kv("Cost",r.ge?fmt(r.ge," GE"):fmt(r.sl," SL"))}
      ${kv("Repair RB",fmt(r.rr," SL"))}${kv("RP mult.",fmt(r.rpm))}
    </div>
    ${r.cv?blk("Community verdict",r.cv):""}
    ${blk("Community: pros",r.cp,"good")}${blk("Community: cons",r.cc,"bad")}${blk("How to fly it",r.tip)}
    ${blk("By the numbers (vs same-BR planes)",[r.str&&("+ "+r.str),r.wk&&("− "+r.wk)].filter(Boolean).join("  ·  "))}
    ${r.ss&&r.ss!==r.s?`<div class="pos">Stats-only style: ${esc(r.ss)}</div>`:""}
    ${r.vs?`<div class="blk"><h4>Verification · ${esc(r.vs)}</h4>${r.vn?`<p>${esc(r.vn)}</p>`:""}${r.vsrc?`<div class="pos">Checked against: ${r.vsrc.split(" ; ").map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u.replace(/^https?:\/\/(www\.)?/,"").slice(0,44))}</a>`).join(" · ")}</div>`:""}</div>`:""}
    ${r.src?`<div class="pos">Source: ${r.src.split(" ; ").map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u.replace(/^https?:\/\//,"").slice(0,48))}</a>`).join(" · ")}</div>`:""}
  </div></details>`;
}
function renderPlanes(){
  const q=st.q.trim().toLowerCase();
  const all=st.nation==="All";
  let rows=DATA.filter(r=>all||r.n===st.nation);
  if(st.rank) rows=rows.filter(r=>r.rk===+st.rank);
  if(st.style) rows=rows.filter(r=>r.s.split(" / ").some(p=>styleKey(p)===st.style) || styleKey(r.s)===st.style);
  if(q) rows=rows.filter(r=>(r.nm+" "+r.fn+" "+r.g+" "+r.dg+" "+r.eng+" "+r.role+" "+r.s+" "+r.cp+" "+r.cc+" "+r.n+" "+(r.tg||[]).join(" ")).toLowerCase().includes(q));
  if(!rows.length){$("planes").innerHTML='<div class="empty">No planes match these filters. Clear the search or pick another style.</div>';return;}
  if(all){
    const byN={}; rows.forEach(r=>(byN[r.n]=byN[r.n]||[]).push(r));
    const many=rows.length>120;
    $("planes").innerHTML=`<div class="count">${rows.length} planes across all nations${many?" · showing the first 120, search or filter to narrow down":""}. Tap a plane for full stats.</div>`+
      NATIONS.filter(n=>byN[n]).map(n=>`<section class="rank"><h2>${esc(n)} <span style="font-size:.8rem;color:var(--muted);letter-spacing:0">${byN[n].length}</span></h2><div class="grid">${(many?byN[n].slice(0,Math.ceil(120*byN[n].length/rows.length)):byN[n]).map(card).join("")}</div></section>`).join("");
    return;
  }
  const by={}; rows.forEach(r=>(by[r.rk]=by[r.rk]||[]).push(r));
  $("planes").innerHTML=`<div class="count">${rows.length} planes · sorted as in the research tree (rank, column, position). Tap a plane for full stats.</div>`+
    Object.keys(by).sort((a,b)=>a-b).map(k=>`<section class="rank"><h2>Rank ${ROMAN[k]}</h2><div class="grid">${by[k].map(card).join("")}</div></section>`).join("");
}
function pickItem(p, extra){
  const r=BYID[p.id];
  return `<li><details class="pick" data-id="${esc(p.id||"")}"><summary><span class="rkb">${ROMAN[p.rk]||""}</span>${esc(p.name)}${p.obtain!=="Tech tree"?" ★":""} <span>${p.br.toFixed(1)} · ${esc(p.style)}${extra||""}</span></summary><div class="pickbody"></div></details></li>`;
}
function stepBlock(x){
  if(!x.step||!x.step.length) return "";
  return `<div class="stepup"><div class="stephd">Worth stepping up for</div><ol>${x.step.map(p=>pickItem(p,` · plays like ~${(p.pl||p.br).toFixed(1)} · lineup becomes <b>${p.to.toFixed(1)}</b>`)).join("")}</ol></div>`;
}
function watchBlock(x){
  if(!x.watch||!x.watch.length) return "";
  return `<div class="stepup watch"><div class="stephd">Watch out for (any nation)</div><ol>${x.watch.map(p=>pickItem(p,` · ${esc(p.n)} · plays like ~${(p.pl||p.br).toFixed(1)}`)).join("")}</ol></div>`;
}
function lineupRows(rows){
  return rows.map(x=>{const L=st.under?(x.under||[]):st.lstyle!=="all"?((x.styles&&x.styles[st.lstyle])||[]):(st.tech?x.tech:x.best);if(!L.length)return "";return `<div class="lurow"><div class="lubr">${x.br.toFixed(1)}<small>${st.lmode} BR</small></div><div class="lucol"><ol>${L.map(p=>pickItem(p,st.under&&p.pl?` · <b class="plays">plays like ~${p.pl.toFixed(1)}</b>`:"")).join("")}</ol>${st.step?stepBlock(x):""}${watchBlock(x)}</div></div>`}).join("");
}
function renderLineups(){
  if(st.nation==="All"){$("lineups").innerHTML='<p class="note">Lineups are per nation. Pick a nation above.</p>';return;}
  const rows=LINEUPS.filter(x=>x.nation===st.nation && x.mode===st.lmode);
  $("lineups").innerHTML=st.under?`<p class="note"><b>Undertiered</b>: for each BR, the 5 planes rated at or below it that perform the most above their rating, so your lineup stays at that BR but flies like a higher one. One plane is always at exactly the lineup BR. "Plays like" is an estimate from stats plus community opinion. Roman numeral = research rank. Tap a plane for details. ★ = premium, event or squadron.</p><div class="lu">`+lineupRows(rows)+"</div>":`<p class="note">Five strongest picks for each lineup BR (the highest plane sets the lineup's BR). ${st.lmode==="RB"?"In Air RB you usually get one life, so pick 1 is your main plane.":"Arcade lineups include one strike plane for ground targets."} ${st.step?"<b>Step up</b> shows planes up to 1.0 BR higher that play above their BR and beat your weakest pick; bringing one raises your whole lineup to its BR. ":""}<b>Watch out for</b> lists enemy planes (any nation) you can meet at that BR that play well above their rating. ${st.lstyle!=="all"?`Showing only ${({bnz:"Boom & Zoom",nrg:"energy",trn:"turn"})[st.lstyle]} fighters (premiums included). `:""}Roman numeral = the plane's research rank. Tap any plane for full details. ★ = premium, event or squadron.</p><div class="lu">`+lineupRows(rows)+"</div>";
}
function render(){
  $("tab-planes").setAttribute("aria-pressed",st.view==="planes");$("tab-lineups").setAttribute("aria-pressed",st.view==="lineups");
  $("planes").hidden=st.view!=="planes";$("lineups").hidden=st.view!=="lineups";
  $("ctl-planes").hidden=st.view!=="planes";$("ctl-lineups").hidden=st.view!=="lineups";
  $("m-rb").setAttribute("aria-pressed",st.mode==="rb");$("m-ab").setAttribute("aria-pressed",st.mode==="ab");
  $("l-rb").setAttribute("aria-pressed",st.lmode==="RB");$("l-ab").setAttribute("aria-pressed",st.lmode==="AB");
  $("l-all").setAttribute("aria-pressed",!st.tech&&!st.step&&!st.under);$("l-tech").setAttribute("aria-pressed",st.tech);$("l-step").setAttribute("aria-pressed",st.step);$("l-under").setAttribute("aria-pressed",st.under);
  ["all","bnz","nrg","trn"].forEach(k=>$("ls-"+k).setAttribute("aria-pressed",st.lstyle===k));
  if(st.view==="planes"){rankOptions();renderPlanes();}else renderLineups();
}
$("tab-planes").onclick=()=>{st.view="planes";save();render();window.scrollTo(0,0)};
$("tab-lineups").onclick=()=>{st.view="lineups";save();render();window.scrollTo(0,0)};
$("q").oninput=e=>{st.q=e.target.value;renderPlanes();};
$("style").onchange=e=>{st.style=e.target.value;renderPlanes();};
$("rank").onchange=e=>{st.rank=e.target.value;renderPlanes();};
$("m-rb").onclick=()=>{st.mode="rb";save();render()};$("m-ab").onclick=()=>{st.mode="ab";save();render()};
$("l-rb").onclick=()=>{st.lmode="RB";save();render()};$("l-ab").onclick=()=>{st.lmode="AB";save();render()};
["all","bnz","nrg","trn"].forEach(k=>{$("ls-"+k).onclick=()=>{st.lstyle=k;save();render()}});
const lv=(t,s,u)=>{st.tech=t;st.step=s;st.under=u;if(u||s)st.lstyle="all";save();render()};
$("l-all").onclick=()=>lv(false,false,false);$("l-tech").onclick=()=>lv(true,false,false);$("l-step").onclick=()=>lv(false,true,false);$("l-under").onclick=()=>lv(false,false,true);
// open a plane's full card inside the lineup when tapped (built on first open)
document.addEventListener("toggle",e=>{const d=e.target;if(!d.classList||!d.classList.contains("pick")||!d.open)return;const b=d.querySelector(".pickbody");if(b.innerHTML)return;const r=BYID[d.dataset.id];b.innerHTML=r?card(r).replace('<details class="card">','<details class="card" open>'):'<p class="note">Details not found.</p>';},true);
if(st.nation!=="All" && !NATIONS.includes(st.nation)) st.nation="USA";

function toast(msg){
  const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);
  setTimeout(()=>t.remove(),4500);
}
async function getJSON(path){
  const r=await fetch(path+"?t="+Date.now(),{cache:"no-store"});
  if(!r.ok) throw new Error(path+" "+r.status);
  return r.json();
}
async function boot(){
  $("planes").innerHTML='<div class="empty">Loading planes…</div>';
  try{
    const [m,p,l]=await Promise.all([getJSON("data/meta.json"),getJSON("data/planes.json"),getJSON("data/lineups.json")]);
    META=m;DATA=p;LINEUPS=l;
  }catch(e){
    // offline: the service worker serves the last saved copy; if that fails too, say so
    try{
      const [m,p,l]=await Promise.all(["data/meta.json","data/planes.json","data/lineups.json"].map(u=>fetch(u).then(r=>r.json())));
      META=m;DATA=p;LINEUPS=l;
    }catch(e2){
      $("planes").innerHTML='<div class="empty">Couldn\'t load plane data. Connect to the internet once and reopen the app.</div>';
      return;
    }
  }
  BYID={};DATA.forEach(r=>BYID[r.id]=r);
  $("ver").textContent=`${DATA.length} props · game v${META.game_version||"?"}`;
  let seen=null; try{seen=localStorage.getItem("wt-seen-version")}catch(e){}
  if(seen && META.game_version && seen!==META.game_version) toast(`Updated to game v${META.game_version}`);
  try{localStorage.setItem("wt-seen-version",META.game_version||"")}catch(e){}
  nationBar();render();
}
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{});}
boot();
</script>
</body>
</html>
